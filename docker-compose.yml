# Интернет-магазин автозапчастей: PostgreSQL + Redis + Spring Boot backend + Angular frontend (nginx)
name: autoparts

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autoparts}
      POSTGRES_USER: ${DB_USERNAME:-autoparts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autoparts}
      TZ: UTC
    ports:
      # 5433 на хосте — чтобы не конфликтовать с локально установленным PostgreSQL
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-autoparts} -d ${DB_NAME:-autoparts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: autoparts-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-autoparts}
      DB_USERNAME: ${DB_USERNAME:-autoparts}
      DB_PASSWORD: ${DB_PASSWORD:-autoparts}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    image: autoparts-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"

volumes:
  pgdata:
  redisdata:
